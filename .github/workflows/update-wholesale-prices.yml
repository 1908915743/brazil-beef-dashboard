name: Update wholesale price brief

on:
  schedule:
    # Daily at 08:30 UTC (16:30 China Standard Time)
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wholesale-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch authorized source feeds
        env:
          MOA_WHOLESALE_API_URL: ${{ secrets.MOA_WHOLESALE_API_URL }}
          SCOT_CARCACA_API_URL: ${{ secrets.SCOT_CARCACA_API_URL }}
        run: python scripts/update_wholesale_prices.py
      - name: Commit updated JSON
        run: |
          if git diff --quiet -- wholesale_price.json; then
            echo "No changes to price brief."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wholesale_price.json
          git commit -m "chore: update wholesale price brief"
          git push
